name: GX Store API Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture GX Store API schema
        shell: python
        run: |
          import json
          import urllib.request

          headers = {
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36"
          }

          urls = {
              "LISTING": "https://api.gx.me/store/v3/mods?page=0&pageSize=2&sort=total-downloads-desc&tagAlias=desktop",
              "DETAIL": "https://api.gx.me/store/v3/mods/nsxjip",
              "TAGS": "https://api.gx.me/store/tags?page=0&pageSize=10&rootOnly=true&locale=en",
          }

          for label, url in urls.items():
              print(f"===== {label} {url} =====")
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              rendered = json.dumps(payload, indent=2, ensure_ascii=False)
              print(rendered[:60000])
              print(f"===== END {label}; JSON_CHARS={len(rendered)} =====")
