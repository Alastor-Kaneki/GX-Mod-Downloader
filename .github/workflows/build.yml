name: Build and publish GX Mod Downloader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android immersive wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct native source tree
        run: python scripts/reconstruct-source.py
      - name: Reconstruct icon pack
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/reconstruct-icon-pack.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android --stacktrace --no-daemon :app:assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/GX-Mod-Downloader-0.2.0-alpha-android-debug.apk
          sha256sum dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows WebView2 wrapper
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct native source tree
        run: python scripts/reconstruct-source.py
      - name: Reconstruct icon pack
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/reconstruct-icon-pack.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows-publish | Out-Null
          dotnet publish windows/GXModDownloader.csproj -c Release -r win-x64 --self-contained true -o dist/windows-publish
          New-Item -ItemType Directory -Force dist/windows-publish/opera-extension | Out-Null
          Copy-Item shared/theme-catalog.js dist/windows-publish/opera-extension/theme-catalog.js -Force
          Copy-Item shared/wrapper-bootstrap.js dist/windows-publish/opera-extension/wrapper-bootstrap.js -Force
          Copy-Item shared/gx-archive-downloader.user.js dist/windows-publish/opera-extension/gx-archive-downloader.user.js -Force
          Compress-Archive -Path dist/windows-publish/* -DestinationPath dist/GX-Mod-Downloader-0.2.0-windows-x64-portable.zip -Force
      - name: Build Windows setup EXE
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss
      - name: Stage Windows files
        shell: pwsh
        run: |
          Get-FileHash dist/GX-Mod-Downloader-0.2.0-windows-x64-setup.exe -Algorithm SHA256
          Get-FileHash dist/GX-Mod-Downloader-0.2.0-windows-x64-portable.zip -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/GX-Mod-Downloader-0.2.0-windows-x64-setup.exe
            dist/GX-Mod-Downloader-0.2.0-windows-x64-portable.zip
          if-no-files-found: error

  linux:
    name: Linux GTK/WebKit wrapper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct native source tree
        run: python scripts/reconstruct-source.py
      - name: Reconstruct icon pack
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/reconstruct-icon-pack.py
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential meson ninja-build pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjson-glib-dev \
            libsoup-3.0-dev libarchive-dev desktop-file-utils \
            patchelf squashfs-tools libfuse2 wget unzip
      - name: Build native Linux packages
        run: scripts/package-appimage.sh
      - name: Build AppImage
        run: |
          cd dist
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          export DEPLOY_GTK_VERSION=3
          export LINUXDEPLOY_OUTPUT_VERSION=0.2.0
          export OUTPUT=GX-Mod-Downloader-0.2.0-linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin gtk --output appimage
          test -f "$OUTPUT"
          chmod +x "$OUTPUT"
          ./$OUTPUT --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          rm -rf squashfs-root linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh linux-build AppDir
          sha256sum GX-Mod-Downloader-0.2.0-linux-x86_64.AppImage GX-Mod-Downloader-0.2.0-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/GX-Mod-Downloader-0.2.0-linux-x86_64.AppImage
            dist/GX-Mod-Downloader-0.2.0-linux-amd64.deb
          if-no-files-found: error

  release:
    name: Update alpha release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum GX-Mod-Downloader-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.2.0-alpha
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GX Mod Downloader 0.2.0 Alpha" --prerelease --notes-file - <<'NOTES'
          Rebuilt as native web wrappers around the GX Store.

          - Android: immersive WebView, native CRX/ZIP downloads, 56 selectable icon/theme presets.
          - Windows: WinForms + WebView2, setup EXE and portable build, Opera GX companion launch.
          - Linux: GTK + WebKitGTK, AppImage and DEB, Opera GX companion launch.
          - Downloads are archives only; the app never installs or activates GX mods.
          NOTES
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GX Mod Downloader 0.2.0 Alpha" --prerelease --notes-file - <<'NOTES'
          Rebuilt as native web wrappers around the GX Store.

          - Android: immersive WebView, native CRX/ZIP downloads, 56 selectable icon/theme presets.
          - Windows: WinForms + WebView2, setup EXE and portable build, Opera GX companion launch.
          - Linux: GTK + WebKitGTK, AppImage and DEB, Opera GX companion launch.
          - Downloads are archives only; the app never installs or activates GX mods.
          NOTES
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
