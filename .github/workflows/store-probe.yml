name: GX Store API Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GX Store frontend endpoints
        shell: python
        run: |
          import re
          import urllib.request
          from urllib.parse import urljoin

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36"
          }
          req = urllib.request.Request("https://store.gx.me/mods/?tagAlias=desktop", headers=headers)
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          print("HTML_BYTES", len(html))
          scripts = sorted(set(re.findall(r'<script[^>]+src=["\']([^"\']+)', html)))
          print("SCRIPT_COUNT", len(scripts))
          patterns = (
              "api.gx.me", "/store/v", "modShortId", "tagAlias", "last-modified-desc",
              "marketplace", "searchParams", "contentUrl"
          )
          for src in scripts:
              url = urljoin("https://store.gx.me/", src)
              try:
                  req = urllib.request.Request(url, headers=headers)
                  text = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
              except Exception as exc:
                  print("SCRIPT_ERROR", url, repr(exc))
                  continue
              if any(p in text for p in patterns):
                  print("MATCHING_SCRIPT", url, "BYTES", len(text))
                  for match in sorted(set(re.findall(r'https://api\.gx\.me[^"\'\\\s`]+', text))):
                      print("API_URL", match[:500])
                  for needle in ("/store/v3/", "/store/v2/", "/store/v1/", "tagAlias", "last-modified-desc"):
                      start = 0
                      shown = 0
                      while shown < 8:
                          pos = text.find(needle, start)
                          if pos < 0:
                              break
                          print("CONTEXT", needle, text[max(0, pos-350):pos+700].replace("\n", " ")[:1200])
                          start = pos + len(needle)
                          shown += 1
