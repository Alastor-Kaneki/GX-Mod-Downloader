name: Android startup hotfix candidate

on:
  push:
    branches: [android-startup-hotfix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source and apply overrides
        run: python scripts/reconstruct-source.py
      - name: Reconstruct icon pack
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/reconstruct-icon-pack.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile hotfix APK
        run: gradle -p android --stacktrace --no-daemon :app:assembleDebug
      - name: Verify APK structure
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='dev.alastorkaneki.gxmods' versionCode='3' versionName='0.2.1-alpha'" apk-badging.txt
          grep -F "launchable-activity: name='dev.alastorkaneki.gxmods.icon.basic_classic'" apk-badging.txt
          mkdir -p dist
          cp "$APK" dist/GX-Mod-Downloader-0.2.1-alpha-android-debug.apk
          sha256sum dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: android-startup-hotfix
          path: dist/*
          if-no-files-found: error
