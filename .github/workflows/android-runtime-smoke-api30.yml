name: Android API 30 smoke test

on:
  push:
    branches: [debug-runtime]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/reconstruct-source.py
      - run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/reconstruct-icon-pack.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android --stacktrace --no-daemon :app:assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail
            adb logcat -c
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n dev.alastorkaneki.gxmods/.MainActivity
            sleep 8
            adb shell pidof dev.alastorkaneki.gxmods
            adb logcat -d -v threadtime > android-api30-logcat.txt
            ! grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: dev.alastorkaneki.gxmods" android-api30-logcat.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api30-logcat
          path: android-api30-logcat.txt
          if-no-files-found: warn
