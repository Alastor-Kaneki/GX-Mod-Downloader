name: Publish v0.1.0 Alpha

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-alpha.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: "30980097321"
      BUILD_SHA: "dd06186f674695fc6a12bbdabc55220f4dd5a3a7"
      TAG: "v0.1.0-alpha"
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifacts
        run: |
          mkdir -p /tmp/artifacts dist
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/artifacts
          cp /tmp/artifacts/gx-mod-downloader-android-debug/composeApp-debug.apk \
            dist/GX-Mod-Downloader-0.1.0-alpha-android-debug.apk
          cp /tmp/artifacts/gx-mod-downloader-linux/deb/gxmoddownloader_0.1.0_amd64.deb \
            dist/GX-Mod-Downloader-0.1.0-linux-amd64.deb
          cp /tmp/artifacts/gx-mod-downloader-linux/rpm/gxmoddownloader-0.1.0-1.x86_64.rpm \
            dist/GX-Mod-Downloader-0.1.0-linux-x86_64.rpm
          cp /tmp/artifacts/gx-mod-downloader-windows/exe/GXModDownloader-0.1.0.exe \
            dist/GX-Mod-Downloader-0.1.0-windows-x64.exe
          cp /tmp/artifacts/gx-mod-downloader-windows/msi/GXModDownloader-0.1.0.msi \
            dist/GX-Mod-Downloader-0.1.0-windows-x64.msi

      - name: Build portable Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils file

          rm -rf /tmp/gx-deb-root /tmp/GXModDownloader.AppDir /tmp/appimage-check
          mkdir -p /tmp/gx-deb-root /tmp/appimage-check \
            /tmp/GXModDownloader.AppDir/usr/lib /tmp/GXModDownloader.AppDir/usr/bin
          dpkg-deb -x dist/GX-Mod-Downloader-0.1.0-linux-amd64.deb /tmp/gx-deb-root
          cp -a /tmp/gx-deb-root/opt/gxmoddownloader /tmp/GXModDownloader.AppDir/usr/lib/gxmoddownloader

          ln -s ../lib/gxmoddownloader/bin/GXModDownloader \
            /tmp/GXModDownloader.AppDir/usr/bin/GXModDownloader
          cat > /tmp/GXModDownloader.AppDir/AppRun <<'APP_RUN'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/lib/gxmoddownloader/bin/GXModDownloader" "$@"
          APP_RUN
          chmod +x /tmp/GXModDownloader.AppDir/AppRun

          mkdir -p \
            /tmp/GXModDownloader.AppDir/usr/share/applications \
            /tmp/GXModDownloader.AppDir/usr/share/icons/hicolor/512x512/apps
          cat > /tmp/GXModDownloader.AppDir/gx-mod-downloader.desktop <<'DESKTOP_FILE'
          [Desktop Entry]
          Name=GX Mod Downloader
          Comment=Unofficial native browser and downloader for Opera GX mods
          Exec=GXModDownloader
          Icon=gx-mod-downloader
          Terminal=false
          Type=Application
          Categories=Utility;
          DESKTOP_FILE
          desktop-file-validate /tmp/GXModDownloader.AppDir/gx-mod-downloader.desktop
          cp /tmp/GXModDownloader.AppDir/gx-mod-downloader.desktop \
            /tmp/GXModDownloader.AppDir/usr/share/applications/gx-mod-downloader.desktop
          cp /tmp/GXModDownloader.AppDir/usr/lib/gxmoddownloader/lib/GXModDownloader.png \
            /tmp/GXModDownloader.AppDir/gx-mod-downloader.png
          cp /tmp/GXModDownloader.AppDir/gx-mod-downloader.png \
            /tmp/GXModDownloader.AppDir/usr/share/icons/hicolor/512x512/apps/gx-mod-downloader.png
          ln -s gx-mod-downloader.png /tmp/GXModDownloader.AppDir/.DirIcon

          curl --fail --location --retry 5 \
            --output /tmp/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool-x86_64.AppImage
          /tmp/appimagetool-x86_64.AppImage \
            /tmp/GXModDownloader.AppDir \
            dist/GX-Mod-Downloader-0.1.0-linux-x86_64.AppImage
          chmod +x dist/GX-Mod-Downloader-0.1.0-linux-x86_64.AppImage

          file dist/GX-Mod-Downloader-0.1.0-linux-x86_64.AppImage
          (
            cd /tmp/appimage-check
            "$GITHUB_WORKSPACE/dist/GX-Mod-Downloader-0.1.0-linux-x86_64.AppImage" --appimage-extract >/dev/null
            test -x squashfs-root/AppRun
            test -x squashfs-root/usr/lib/gxmoddownloader/bin/GXModDownloader
          )

      - name: Generate checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish prerelease
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          First functional native alpha of GX Mod Downloader.

          Included:
          - Android debug APK
          - Windows EXE and MSI installers
          - Linux AppImage, DEB, and RPM packages
          - SHA-256 checksums

          Features:
          - Native GX Store search, browsing, sorting, filters, and pagination
          - GX-inspired adaptive interface
          - Native package downloads on Android, Windows, and Linux
          - Official GX content-host allowlist
          - CRX2/CRX3 header and embedded ZIP validation
          - Download history and mod detail views

          Important: the Android APK is debug-signed for alpha testing. A permanent private repository signing identity will replace it before update-compatible production releases. This app downloads packages only and never silently installs or enables GX mods.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "GX Mod Downloader 0.1.0 Alpha" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$BUILD_SHA" --prerelease \
              --title "GX Mod Downloader 0.1.0 Alpha" \
              --notes-file /tmp/release-notes.md
          fi
