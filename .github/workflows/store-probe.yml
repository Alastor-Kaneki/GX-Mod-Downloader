name: Publish Initial App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand reviewed project source
        shell: bash
        run: |
          cat _bootstrap/payload.part* > /tmp/gxproject.b64
          base64 --decode /tmp/gxproject.b64 > /tmp/gxproject.tar.gz
          tar -xzf /tmp/gxproject.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf _bootstrap
          rm -f .github/workflows/store-probe.yml
      - name: Commit application source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Build native GX Mod Downloader alpha"
          git push origin HEAD:main
