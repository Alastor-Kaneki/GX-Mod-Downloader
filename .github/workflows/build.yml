name: Build GX Mod Downloader

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-linux:
    name: Android and Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test and package
        run: >-
          gradle --stacktrace --no-daemon
          :composeApp:desktopTest
          :composeApp:assembleDebug
          :composeApp:packageDeb
          :composeApp:packageRpm
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gx-mod-downloader-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: gx-mod-downloader-linux
          path: |
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Package Windows installers
        shell: pwsh
        run: >-
          gradle --stacktrace --no-daemon
          :composeApp:packageMsi
          :composeApp:packageExe
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: gx-mod-downloader-windows
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
